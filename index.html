<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Hobby | 趣味紹介</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>My Hobby</h1>
    <nav>
      <a href="#about">自己紹介</a>
      <a href="#hobby">趣味</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <p class="subtitle">WELCOME TO MY PAGE</p>
      <h2>私の好きなことを紹介します！</h2>
      <p>趣味や好きなものをまとめた自己紹介サイトです。</p>
      <a href="#hobby" class="button">趣味を見る</a>
    </section>

    <section id="about">
      <h2>About Me</h2>
      <p>
        こんにちは！このページを見てくれてありがとうございます。
        私の好きなことや趣味を紹介していきます。
      </p>
    </section>

    <section id="hobby">
      <h2>My Favorite</h2>

      <div class="cards">
        <div class="card">
          <div class="emoji">☕</div>
          <h3>カフェ</h3>
          <p>カフェでゆっくり過ごしたり、スイーツを食べるのが好きです。</p>
        </div>

        <div class="card">
          <div class="emoji">💻</div>
          <h3>プログラミング</h3>
          <p>自分でWebページやアプリを作ることに興味があります。</p>
        </div>
      </div>
    </section>

    <section class="message">
      <h2>最後まで見てくれてありがとう！</h2>
      <button id="messageButton">ボタンを押してね！</button>
      <p id="result"></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 My Hobby</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
